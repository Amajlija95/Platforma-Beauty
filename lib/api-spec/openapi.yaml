              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    put:
      operationId: adminUpdateRetentionSettings
      tags: [growth]
      summary: Update platform retention thresholds (admin); records an audited new version. Requires the expected active version (optimistic concurrency) — a stale version is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionSettingsUpdate" }
      responses:
        "200":
          description: Newly active retention settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "400": { description: Validation error (out-of-range or inconsistent thresholds) }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "409":
          description: Another admin saved a newer version since the client last loaded the settings; refetch and re-confirm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettingsVersionConflict" }

  /growth/admin/retention-settings/preview:
    post:
