components:
  responses:
    BookingCapacityReached:
      description: Booking admission capacity is full; retry after the indicated delay.
      headers:
        Retry-After:
          description: Suggested delay in seconds before retrying the booking.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BookingCapacityError" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated command identifier; reuse it only to retry the identical booking payload.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    WidgetBookingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required client-generated widget booking identifier; reuse it only to retry the identical payload.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    CityQuery:
      name: city
      in: query
      schema: { type: string }
    CategoryQuery:
      name: category
      in: query
      schema: { type: string }
    TreatmentQuery:
      name: treatment
      in: query
      schema: { type: string }
    SortQuery:
      name: sort
      in: query
      schema: { type: string, enum: [recommended, top-rated, cheapest, largest-discount, nearest, first-available, most-popular, most-booked-recently, newest], default: recommended }
    SalonSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SalonId:
      name: salonId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string }
    EducationCenterId:
      name: centerId
      in: path
      required: true
      schema: { type: string }
    EducationDisputeId:
      name: disputeId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    WaitlistId:
      name: waitlistId
      in: path
      required: true
      schema: { type: string }
  schemas:
    PublicSocialImage:
      type: object
      description: Selected public social image. Dimensions and MIME type are present only when verified from a managed image variant.
      additionalProperties: false
      properties:
        url: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        type: { type: string, enum: [image/avif, image/webp, image/jpeg, image/png] }
      required: [url]
    AdminPriceInquiry:
      type: object
      required:
        - id
        - supplierId
        - productId
        - productName
        - supplierName
        - contactName
        - contactEmail
        - contactPhone
        - message
        - status
        - internalNote
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        supplierId: { type: string }
        productId: { type: string }
        productName: { type: string }
        supplierName: { type: string }
        contactName: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        message: { type: string }
        status: { type: string, enum: [NEW, CONTACTED, CLOSED] }
        internalNote: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPriceInquiryPage:
      type: object
      required: [items, page, pageSize, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPriceInquiry"
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        hasNext: { type: boolean }
    AdminPriceInquiryUpdate:
      type: object
      properties:
        status: { type: string, enum: [NEW, CONTACTED, CLOSED] }
        internalNote: { type: ["string", "null"], maxLength: 5000 }
    RmaRecordBase:
      type: object
      required:
        - id
        - rmaNumber
        - requesterUserId
        - quantity
        - reason
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        rmaNumber: { type: string }
        requesterUserId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string }
        description: { type: string }
        status: { type: string, enum: [RECEIVED, IN_REVIEW, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StandardRmaRecord:
      allOf:
        - { $ref: "#/components/schemas/RmaRecordBase" }
        - type: object
          required: [orderId, orderItemId, retailOrderId, retailOrderItemId]
          properties:
            orderId: { type: string, format: uuid }
            orderItemId: { type: string, format: uuid }
            retailOrderId: { type: "null" }
            retailOrderItemId: { type: "null" }
    RetailRmaRecord:
      allOf:
        - { $ref: "#/components/schemas/RmaRecordBase" }
        - type: object
          required: [orderId, orderItemId, retailOrderId, retailOrderItemId]
          properties:
            orderId: { type: "null" }
            orderItemId: { type: "null" }
            retailOrderId: { type: string, format: uuid }
            retailOrderItemId: { type: string, format: uuid }
    RmaRecord:
      oneOf:
        - { $ref: "#/components/schemas/StandardRmaRecord" }
        - { $ref: "#/components/schemas/RetailRmaRecord" }
    AdminRmaOwner:
      type: object
      required: [email]
      properties:
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        businessName: { type: ["string", "null"] }
        pib: { type: ["string", "null"] }
        email: { type: string }
    AdminRmaListItem:
      oneOf:
        - allOf:
            - { $ref: "#/components/schemas/StandardRmaRecord" }
            - type: object
              required: [target, owner]
              properties:
                target: { type: string, const: b2b }
                owner: { $ref: "#/components/schemas/AdminRmaOwner" }
        - allOf:
            - { $ref: "#/components/schemas/RetailRmaRecord" }
            - type: object
              required: [target, owner]
              properties:
                target: { type: string, const: b2c }
                owner: { $ref: "#/components/schemas/AdminRmaOwner" }
    AdminRmaItem:
      type: object
      required: [orderItemId, productName, quantity]
      properties:
        orderItemId: { type: string, format: uuid }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
    AdminRmaAuditEntry:
      type: object
      required: [action, timestamp, actorId, note]
      properties:
        action: { type: string }
        timestamp: { type: string, format: date-time }
        actorId: { type: ["string", "null"], format: uuid }
        note: { type: ["string", "null"] }
    AdminRmaDetail:
      allOf:
        - { $ref: "#/components/schemas/AdminRmaListItem" }
        - type: object
          required: [items, privatePhotos, auditTrail]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminRmaItem" }
            privatePhotos:
              type: array
              items: { type: string }
            auditTrail:
              type: array
              items: { $ref: "#/components/schemas/AdminRmaAuditEntry" }
    AdminRmaStatusResult:
      type: object
      required: [row, changed]
      properties:
        row: { $ref: "#/components/schemas/RmaRecord" }
        changed: { type: boolean }
    CatalogSyncRun:
      type: object
      required: [id, provider, status, itemCount, validationErrors, createdAt]
      properties:
        id: { type: string }
        provider: { type: string }
        status: { type: string }
        itemCount: { type: integer, minimum: 0 }
        validationErrors: { type: array, items: { type: string } }
        requestedByUserId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    MetaCatalogStatus:
      type: object
      required: [connectionStatus, canSync, latestRun]
      properties:
        connectionStatus: { type: string, enum: [NOT_CONNECTED] }
        canSync: { type: boolean }
        latestRun:
          anyOf:
            - { $ref: "#/components/schemas/CatalogSyncRun" }
            - { type: "null" }
    MetaCatalogValidationResponse:
      type: object
      required: [connectionStatus, canSync, run]
      properties:
        connectionStatus: { type: string, enum: [NOT_CONNECTED] }
        canSync: { type: boolean }
        run: { $ref: "#/components/schemas/CatalogSyncRun" }
    ReviewRewardSettings:
      type: object
      required: [enabled, invitationDelayDays, percent, validityDays, version]
      properties:
        enabled: { type: boolean }
        invitationDelayDays: { type: integer, minimum: 7, maximum: 10 }
        percent: { type: integer, minimum: 1, maximum: 100 }
        validityDays: { type: integer, minimum: 1, maximum: 365 }
        version: { type: integer, minimum: 1 }
    ReviewRewardSettingsResponse:
      type: object
      required: [settings, stats]
      properties:
        settings: { $ref: "#/components/schemas/ReviewRewardSettings" }
        stats:
          type: object
          required: [issued]
          properties:
            issued: { type: integer, minimum: 0 }
    BulkMatrixTierPrice:
      type: object
      required: [minQuantity, maxQuantity, unitPrice]
      properties:
        minQuantity: { type: integer, minimum: 1 }
        maxQuantity: { type: [integer, "null"], minimum: 1 }
        unitPrice: { type: integer, minimum: 0 }
    BulkMatrixSwatch:
      oneOf:
        - type: object
          required: [kind, hex]
          properties:
            kind: { type: string, enum: [COLOR] }
            hex: { type: string, pattern: "^#[0-9A-F]{6}$" }
        - type: object
          required: [kind, imageUrl]
          properties:
            kind: { type: string, enum: [IMAGE] }
            imageUrl: { type: string }
        - type: object
          required: [kind, text]
          properties:
            kind: { type: string, enum: [TEXT] }
            text: { type: string }
    BulkMatrixRow:
      type: object
      required: [value, label, sku, available, stock, swatch, mainImageUrl, altText, sortOrder]
      properties:
        value: { type: string }
        label: { type: string }
        sku: { type: [string, "null"] }
        available: { type: boolean }
        stock:
          type: integer
          minimum: 0
          description: Effective available quantity; shared-stock variants expose current product stock.
        swatch:
          anyOf:
            - { $ref: "#/components/schemas/BulkMatrixSwatch" }
            - { type: "null" }
        mainImageUrl: { type: [string, "null"] }
        altText: { type: [string, "null"] }
        sortOrder: { type: integer }
        unitPrice:
          type: integer
          minimum: 0
          description: Omitted when priceOnRequest is true.
        tierPricePreview:
          type: array
          items: { $ref: "#/components/schemas/BulkMatrixTierPrice" }
          description: Omitted when priceOnRequest is true.
    BulkMatrixResponse:
      type: object
      required: [productId, priceOnRequest, cartEligible, rows]
      properties:
        productId: { type: string }
        priceOnRequest: { type: boolean }
        cartEligible: { type: boolean }
        rows:
          type: array
          items: { $ref: "#/components/schemas/BulkMatrixRow" }
    BulkMatrixAddResponse:
      type: object
      required: [cartId, addedRows]
      properties:
        cartId: { type: string }
        addedRows: { type: integer, minimum: 0 }
    B2bQuoteRecipientSnapshot:
      type: object
      required: [companyName]
      properties:
        companyName: { type: string }
        registeredCompanyName: { type: string }
        taxId: { type: string }
        registrationNumber: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        email: { type: string }
        phone: { type: string }
    B2bQuoteSellerSnapshot:
      type: object
      required: [companyName]
      properties:
        companyName: { type: string }
        taxId: { type: string }
        registrationNumber: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        bankAccount: { type: string }
        email: { type: string }
        phone: { type: string }
        recipient: { $ref: "#/components/schemas/B2bQuoteRecipientSnapshot" }
    B2bQuoteItemSnapshot:
      type: object
      required: [productId, bundleId, productName, productImageUrl, variantValue, variantLabel, productSku, unitPrice, quantity, lineTotal]
      properties:
        productId: { type: [string, "null"] }
        bundleId: { type: [string, "null"] }
        productName: { type: string }
        productImageUrl: { type: string }
        variantValue: { type: [string, "null"] }
        variantLabel: { type: [string, "null"] }
        productSku: { type: [string, "null"] }
        unitPrice: { type: integer }
        quantity: { type: integer, minimum: 1 }
        lineTotal: { type: integer }
    B2bQuote:
      type: object
      required: [id, publicId, salonId, sellerSnapshot, itemSnapshots, subtotalWithoutVat, vatAmount, totalWithVat, currency, validUntil, createdAt]
      properties:
        id: { type: string }
        publicId: { type: string }
        salonId: { type: string }
        sourceCartId: { type: [string, "null"] }
        customerCompanyName: { type: [string, "null"] }
        sellerSnapshot: { $ref: "#/components/schemas/B2bQuoteSellerSnapshot" }
        itemSnapshots:
          type: array
          items: { $ref: "#/components/schemas/B2bQuoteItemSnapshot" }
        subtotalWithoutVat: { type: integer, minimum: 0 }
        vatAmount: { type: integer, minimum: 0 }
        totalWithVat: { type: integer, minimum: 0 }
        currency: { type: string, enum: [RSD] }
        validUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RetailProductSubscription:
      type: object
      required: [id, productId, quantity, frequency, status, discountPercent, paymentMethod, deliveryMethod, nextDueAt, createdAt]
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        frequency: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY, EVERY_TWO_MONTHS] }
        status: { type: string, enum: [ACTIVE, PAUSED, CANCELLED] }
        discountPercent: { type: integer, minimum: 0, maximum: 100 }
        paymentMethod: { type: string, enum: [CARD, BANK_TRANSFER, CASH_ON_DELIVERY] }
        deliveryMethod: { type: string, enum: [courier, personal_belgrade] }
        nextDueAt: { type: string, format: date-time }
        blockedUntil: { type: [string, "null"], format: date-time }
        pausedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RetailProductSubscriptionInput:
      type: object
      required: [productId, quantity, frequency, paymentMethod, deliveryMethod, contact, delivery]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        frequency: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY, EVERY_TWO_MONTHS] }
        paymentMethod: { type: string, enum: [CARD, BANK_TRANSFER, CASH_ON_DELIVERY] }
        deliveryMethod: { type: string, enum: [courier, personal_belgrade] }
        firstDueAt: { type: string, format: date-time }
        contact:
          type: object
          required: [firstName, lastName, email, phone]
          properties: { firstName: { type: string }, lastName: { type: string }, email: { type: string }, phone: { type: string } }
        delivery:
          type: object
          required: [street, city, postalCode]
          properties: { street: { type: string }, city: { type: string }, postalCode: { type: string }, note: { type: string }, shippingCost: { type: integer, minimum: 0 } }
    ProductWaitlistSubscription:
      type: object
      required: [id, status, subscribed]
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, NOTIFIED, UNSUBSCRIBED] }
        subscribed: { type: boolean }
    ProductWaitlistStatus:
      type: object
      required: [subscribed, status, notifiedAt]
