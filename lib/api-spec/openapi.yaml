      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "422": { description: Requested business-role transition is forbidden because the required business relation is absent or incompatible }
  /admin/users/{userId}/business-conversion:
    post:
      operationId: adminConvertUserToBusinessAccount
      tags: [admin]
      summary: Atomically convert a standalone account to a business account and create its required companion record
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBusinessAccountConversionInput" }
      responses:
        "200":
          description: User role and matching business companion were committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid user id or common conversion details }
        "401": { description: Authentication required }
        "403": { description: SUPER_ADMIN access required }
        "404": { description: Target user or selected active salon or education center does not exist }
        "409": { description: "Companion record, slug, user link, or legal-entity ownership conflicts with existing data" }
        "422": { description: "Target is not a standalone account, already has business relations, or role-specific data is missing or mismatched" }
  /admin/users/{userId}/business-role-transition:
    get:
      operationId: adminGetBusinessRoleTransition
      tags: [admin]
      summary: Inspect all business relations and safe decisions before changing a business role
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      responses:
        "200":
          description: Current account and every relation that must be decided explicitly
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusinessRoleTransitionState" }
        "403": { description: SUPER_ADMIN access required }
        "404": { description: Target user not found }
    post:
      operationId: adminTransitionBusinessRole
      tags: [admin]
      summary: Atomically exit or change a business role while preserving all historical relation rows
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBusinessRoleTransitionInput" }
      responses:
        "200":
          description: Role, active salon, and all relation decisions were committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBusinessRoleTransitionResult" }
        "400": { description: Invalid request }
        "403": { description: SUPER_ADMIN access required }
        "404": { description: Target user or transfer target not found }
        "409": { description: "Concurrent state changed, a transfer target is ineligible, or the transition would orphan a relation" }
        "422": { description: "Missing, duplicate, foreign, or unsafe relation decision" }
