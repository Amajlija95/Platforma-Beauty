        - name: taxonomyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationTaxonomyPatch" }
      responses:
        "200":
          description: Updated taxonomy item
