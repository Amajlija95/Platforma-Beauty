              schema:
                type: object
                required: [generatedAt, items]
                properties:
                  generatedAt: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, supplier, url, price, currency, availability, images]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        supplier: { type: string }
                        url: { type: string }
                        price: { type: [integer, "null"] }
                        currency: { type: string, enum: [RSD] }
                        availability: { type: string, enum: [in_stock] }
                        images: { type: array, items: { type: string } }
