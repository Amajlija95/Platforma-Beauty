  /education/public/courses:
    get:
      operationId: listPublicEducationCourses
      tags: [education]
      summary: List courses available for public purchase
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [online, in-person, hybrid] }
        - name: city
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - name: sectionId
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: subcategoryId
          in: query
          schema: { type: string }
        - name: courseTypeId
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: accredited
          in: query
          schema: { type: boolean }
        - name: certification
          in: query
          schema: { type: boolean }
        - name: minRating
          in: query
          description: Minimum aggregate rating from published course reviews; unrated courses have rating 0.
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: level
          in: query
          schema: { type: string, enum: [beginner, intermediate, advanced, all-levels] }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: startDate
          in: query
          description: Include courses that start on or after this date.
          schema: { type: string, format: date }
        - name: maxDurationDays
          in: query
          description: Include courses whose published daily program has at most this many days.
          schema: { type: number, multipleOf: 1, minimum: 1 }
        - name: minDurationMinutes
          in: query
          description: Include only courses with an explicit parsable duration at or above this bound.
          schema: { type: integer, minimum: 1 }
        - name: maxDurationMinutes
          in: query
          description: Include only courses with an explicit parsable duration at or below this bound.
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          description: 1-based page index for stable createdAt desc, id desc ordering.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of courses per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Public courses with redacted logistics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EducationCourseDetail" }
  /education/public/courses/{courseId}:
