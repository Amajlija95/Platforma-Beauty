      tags: [admin]
      summary: Replace an uncompleted CUSTOMER account's password setup URL
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "201":
          description: Replacement one-time setup URL created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateCustomerSetupResponse" }
        "401": { description: Authentication required }
        "403": { description: SUPER_ADMIN access required }
        "404": { description: Eligible uncompleted CUSTOMER account not found }
        "429": { description: Too many account setup requests }
