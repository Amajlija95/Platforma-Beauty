        "201":
          description: Inquiry accepted
          content:
            application/json:
              schema:
                type: object
                required: [id, status, createdAt]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [NEW] }
                  createdAt: { type: string, format: date-time }
