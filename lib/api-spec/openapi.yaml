            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonResource" }
        "403": { description: Salon-owner access required }
    post:
      operationId: createSalonResource
      tags: [salon-management]
      summary: Create a salon resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonResourceInput" }
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonResource" }
        "400": { description: Invalid input }
        "403": { description: Salon-owner access required }
        "409": { description: A resource with this name already exists in the salon }
  /salon/resources/{resourceId}:
    patch:
      operationId: updateSalonResource
      tags: [salon-management]
      summary: Update a salon resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonResourceUpdate" }
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonResource" }
        "400": { description: Invalid input }
        "403": { description: Salon-owner access required }
        "404": { description: Resource not found }
        "409": { description: A resource with this name already exists in the salon }
    delete:
      operationId: deleteSalonResource
      tags: [salon-management]
      summary: Delete a salon resource (only if no active service requirements reference it)
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Resource deleted }
        "403": { description: Salon-owner access required }
        "404": { description: Resource not found }
        "409":
          description: Resource is referenced by active service requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
