        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateAccountSetupInput" }
      responses:
        "201":
          description: Account, matching business relation, and one-time setup URL created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateCustomerSetupResponse" }
        "400": { description: Invalid common account details }
        "401": { description: Authentication required }
        "403": { description: SUPER_ADMIN access required }
        "404": { description: Selected active salon or education center does not exist }
        "409": { description: "Email, slug, user link, or legal-entity ownership conflicts with existing data" }
        "422": { description: "Missing, mismatched, blank, or invalid role-specific data" }
        "429": { description: Too many account creation attempts }
  /admin/accounts/{userId}/setup:
    post:
      operationId: adminReissueAccountSetup
      tags: [admin]
      summary: Replace an active unconfigured non-SUPER_ADMIN account's setup URL
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "201":
          description: Replacement one-time setup URL created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateCustomerSetupResponse" }
        "403": { description: SUPER_ADMIN access required }
        "404": { description: Eligible unconfigured account not found }
