      responses: { "201": { description: Created promotion, content: { application/json: { schema: { $ref: "#/components/schemas/AutomaticXyPromotion" } } } }, "400": { description: Invalid promotion or targets }, "401": { description: Authentication required }, "403": { description: Administrator access required } }
  /admin/automatic-xy-promotions/{id}:
    patch:
      operationId: adminUpdateAutomaticXyPromotion
      tags: [admin]
