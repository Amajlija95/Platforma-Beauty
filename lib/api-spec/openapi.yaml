      parameters:
        - name: page
          in: query
          description: 1-based page number for stable pagination (lastName asc, firstName asc, id asc).
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of CRM customers per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Salon CRM customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCustomer" }
  /employee/availability/search:
    get:
      operationId: searchEmployeeAvailability
      tags: [salon-management]
      summary: Search the signed-in employee's server-confirmed availability at their active location
      parameters:
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
        - name: startDate
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: granularityMinutes
          in: query
          description: Optional requested cadence. The active salon booking policy remains authoritative.
          schema: { type: integer, minimum: 5, maximum: 180 }
      responses:
        "200":
          description: Chronological server-confirmed slots in the bounded seven-day window for the signed-in employee; calendar clients treat dates without slots as unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilitySearchResponse" }
        "403": { description: Service is not assigned to the signed-in employee at their active salon }
        "404": { description: Active service not found at the employee's active salon }
  /employee/appointment-series/preview:
    post:
      operationId: previewEmployeeAppointmentSeries
      tags: [employee-portal]
      summary: Check availability for an employee appointment series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesPreviewInput" }
      responses:
        "200":
          description: Availability preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesPreview" }
  /employee/appointment-series:
    post:
      operationId: createEmployeeAppointmentSeries
      tags: [employee-portal]
      summary: Create an atomic employee appointment series
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeAppointmentSeriesInput" }
      responses:
        "201":
          description: Created appointment series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesResult" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /employee/appointments:
    post:
      operationId: createEmployeeAppointments
      tags: [employee-portal]
      summary: Atomically create one or more appointments assigned to the signed-in employee
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeAppointmentsInput" }
      responses:
        "201":
          description: Created appointments; an exact Idempotency-Key replay returns this original response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeAppointmentsResult" }
        "400": { description: Invalid request or missing Idempotency-Key }
        "403": { description: "Active employee access, assigned service, or established customer relationship required" }
        "409":
          description: Slot/resource conflict, or Idempotency-Key reused with a different payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AppointmentConflictError"
                  - $ref: "#/components/schemas/IdempotencyMismatchError"
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /salon/customers/{customerId}:
    patch:
      operationId: updateSalonCustomer
