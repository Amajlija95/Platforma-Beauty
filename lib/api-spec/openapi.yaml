      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      operationId: deleteSalonService
      tags: [salon-management]
      summary: Permanently remove a salon service without appointments
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Service removed
        "404":
          description: Service not found
        "409":
          description: Service is linked to existing appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
