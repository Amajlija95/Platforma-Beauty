          application/json:
            schema: { $ref: "#/components/schemas/ServiceConsumptionsPut" }
      responses:
        "200":
          description: Updated consumption mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceConsumption" }
        "400": { description: Invalid mapping payload }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
        "404": { description: Service or product not found }
  /salon/inventory:
    get:
      operationId: listSalonInventory
      tags: [salon-management]
      summary: List salon-owned product inventory with low-stock flags (owner)
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonInventoryItem" }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
  /salon/inventory/{productId}:
    patch:
      operationId: updateSalonInventoryItem
      tags: [salon-management]
      summary: Adjust quantity, threshold or unit settings of an inventory item (owner)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonInventoryItemUpdate" }
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonInventoryItem" }
        "400": { description: Invalid values }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
        "404": { description: Inventory item not found }

  # ── Phase 3: employee time clock ───────────────────────────────────────────
  /employee/clock:
    get:
      operationId: getEmployeeClock
      tags: [salon-management]
      summary: Current clock status and recent entries (employee)
      responses:
        "200":
          description: Clock status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeClockStatus" }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
  /employee/clock-in:
    post:
      operationId: employeeClockIn
      tags: [salon-management]
      summary: Start a shift (employee)
      responses:
        "201":
          description: Shift started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeClockEntry" }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
        "409": { description: A shift is already open }
  /employee/clock-out:
    post:
      operationId: employeeClockOut
      tags: [salon-management]
      summary: End the open shift (employee)
      responses:
        "200":
          description: Shift closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeClockEntry" }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
        "409": { description: No open shift }
  /salon/clock-entries:
    get:
      operationId: listSalonClockEntries
      tags: [salon-management]
      summary: Work-hour records per employee for a period, with appointment counts (owner)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: employeeId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Per-employee work-hour summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonClockEmployeeSummary" }
        "400": { description: Invalid period }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
  /salon/clock-entries/{entryId}:
    patch:
      operationId: updateSalonClockEntry
      tags: [salon-management]
      summary: Manually correct or close a clock entry (owner)
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonClockEntryUpdate" }
      responses:
        "200":
          description: Corrected entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeClockEntry" }
        "400": { description: Invalid correction }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
        "404": { description: Entry not found }

  # ── Phase 3: shift swapping ────────────────────────────────────────────────
  /employee/shift-swaps:
    get:
      operationId: listEmployeeShiftSwaps
      tags: [salon-management]
      summary: Own outgoing/incoming shift-swap requests and colleagues (employee)
      responses:
        "200":
          description: Shift swap overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeShiftSwapOverview" }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
    post:
      operationId: createEmployeeShiftSwap
      tags: [salon-management]
      summary: Propose swapping a working day with a colleague (employee)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftSwapCreate" }
      responses:
        "201":
          description: Swap request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftSwapRequest" }
        "400": { description: Invalid colleague or date }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
        "409": { description: An open request for that day already exists }
  /employee/shift-swaps/{requestId}/respond:
    post:
      operationId: respondEmployeeShiftSwap
      tags: [salon-management]
      summary: Accept or decline a colleague's swap proposal (employee)
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftSwapRespondBody" }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftSwapRequest" }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
        "404": { description: Request not found }
        "409": { description: Request no longer awaiting your response }
  /employee/shift-swaps/{requestId}/cancel:
    post:
      operationId: cancelEmployeeShiftSwap
      tags: [salon-management]
      summary: Cancel an own pending swap request (employee)
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftSwapRequest" }
        "401": { description: Authentication required }
        "403": { description: Salon employee role required }
        "404": { description: Request not found }
        "409": { description: Request can no longer be cancelled }
  /salon/shift-swaps:
    get:
      operationId: listSalonShiftSwaps
      tags: [salon-management]
      summary: Shift-swap requests awaiting approval and history, with both employees' appointments (owner)
      responses:
        "200":
          description: Swap requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonShiftSwapRequest" }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
  /salon/shift-swaps/{requestId}/review:
    post:
      operationId: reviewSalonShiftSwap
      tags: [salon-management]
      summary: Approve or decline an accepted swap; approval reassigns that day's appointments (owner)
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftSwapReviewBody" }
      responses:
        "200":
          description: Reviewed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonShiftSwapRequest" }
        "401": { description: Authentication required }
        "403": { description: Salon owner role required }
        "404": { description: Request not found }
        "409": { description: Request not awaiting owner review }

  # ── Phase 3: public booking widget (CORS-open, rate limited) ──────────────
  /widget/salons/{slug}:
    get:
      operationId: getWidgetSalon
      tags: [widget]
      summary: Public widget bootstrap — salon identity, services and employees
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Widget bootstrap data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetSalon" }
        "404": { description: Salon not found or not bookable }
        "429": { description: Too many requests }
  /widget/salons/{slug}/availability:
    get:
      operationId: getWidgetAvailability
      tags: [widget]
      summary: Public widget availability slots for a service and date
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: serviceId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string } }
        - { name: employeeId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WidgetSlot" }
        "400": { description: Invalid parameters }
        "404": { description: Salon or service not found }
        "429": { description: Too many requests }
  /widget/salons/{slug}/appointments:
    post:
      operationId: createWidgetAppointment
      tags: [widget]
      summary: Public widget booking — creates a pending appointment for the salon
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/WidgetBookingIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetAppointmentCreate" }
      responses:
        "201":
          description: Appointment request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetAppointmentCreated" }
        "400": { description: Invalid booking data }
        "404": { description: Salon or service not found }
        "409": { description: Slot no longer available }
        "429":
          description: Widget rate limit or booking admission capacity reached. Capacity responses use code BOOKING_CAPACITY and include Retry-After.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BookingCapacityError"
                  - type: object
                    properties:
                      error: { type: string }
                    required: [error]
  /widget/salons/{slug}/booking-groups:
    post:
      operationId: createWidgetBookingGroup
      tags: [widget]
      summary: Public rate-limited grouped booking for an anonymous salon customer
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/WidgetBookingIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetBookingGroupCreate" }
      responses:
        "201":
          description: Grouped appointment request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroup" }
        "400": { description: Invalid booking data }
        "404": { description: Salon or service not found }
        "409": { description: One or more slots are no longer available }
        "429":
          description: Widget rate limit or booking admission capacity reached. Capacity responses use code BOOKING_CAPACITY and include Retry-After.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BookingCapacityError"
                  - type: object
                    properties:
                      error: { type: string }
                    required: [error]

  /retail/wishlist:
    get:
      operationId: listProductWishlist
      tags: [shop]
      summary: List the signed-in customer's saved B2C products, including unavailable items
      responses:
        "200": { description: Wishlist items, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProductWishlistItem" } } } } }
        "401": { description: Customer authentication required }
        "403": { description: Customer access required }
    post:
      operationId: addProductWishlistItem
      tags: [shop]
      summary: Idempotently save a currently B2C-visible product
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWishlistInput" } } } }
      responses:
        "200": { description: Already saved wishlist item, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWishlistItem" } } } }
        "201": { description: Saved wishlist item, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWishlistItem" } } } }
        "404": { description: Product is not B2C-visible }
        "401": { description: Customer authentication required }
  /retail/wishlist/toggle:
    post:
      operationId: toggleProductWishlistItem
      tags: [shop]
      summary: Atomically add or remove a customer wishlist item
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWishlistInput" } } } }
      responses:
        "200": { description: Wishlist state, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWishlistToggleResult" } } } }
        "404": { description: Product is not B2C-visible when adding }
        "401": { description: Customer authentication required }
  /retail/wishlist/{productId}:
    delete:
      operationId: removeProductWishlistItem
      tags: [shop]
      summary: Remove a saved product variant from the signed-in customer's wishlist
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: variantValue, in: query, schema: { type: string } }
      responses:
        "204": { description: Removed; missing entries are idempotently ignored }
        "401": { description: Customer authentication required }
  /retail/cart:
    get:
      operationId: getRetailCart
      tags: [shop]
      summary: Get the current guest or authenticated CUSTOMER/JOBSEEKER retail cart
      responses:
        "200": { description: Retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
  /retail/cart-summary:
    get:
      operationId: getRetailCartSummary
      tags: [shop]
      summary: Get the current retail cart item count without creating a cart
      responses:
        "200": { description: Retail cart item count, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCartSummary" } } } }
  /retail/cart/contact:
    put:
      operationId: captureRetailCartContact
      tags: [shop]
      summary: Capture a guest email for an abandoned-cart reminder without checkout
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCartContactInput" } } } }
      responses:
        "204": { description: Contact captured }
        "400": { description: Invalid email address }
  /retail/cart/items:
    post:
      operationId: addRetailCartItem
      tags: [shop]
      summary: Add a retail product to the separate guest or CUSTOMER/JOBSEEKER cart
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCartItemInput" } } } }
      responses:
        "201": { description: Updated retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
  /retail/cart/items/{cartItemId}:
    patch:
      operationId: updateRetailCartItem
      tags: [shop]
      summary: Change a retail cart item quantity
      parameters: [{ name: cartItemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
        "409": { description: Requested quantity is unavailable }
    delete:
      operationId: removeRetailCartItem
      tags: [shop]
      summary: Remove an item from the current retail cart
      parameters: [{ name: cartItemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
  /retail/cart/items/{cartItemId}/save-for-later:
    post:
      operationId: saveRetailCartItemForLater
      tags: [shop]
      summary: Atomically move a retail cart line to saved items
      parameters: [{ name: cartItemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
  /retail/cart/saved-items/{savedItemId}:
    delete:
      operationId: removeSavedRetailCartItem
      tags: [shop]
      summary: Remove a saved retail cart line
      parameters: [{ name: savedItemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
  /retail/cart/saved-items/{savedItemId}/restore:
    post:
      operationId: restoreSavedRetailCartItem
      tags: [shop]
      summary: Restore a saved retail line with current eligibility and price
      parameters: [{ name: savedItemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated retail cart, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCart" } } } }
        "409": { description: Current catalog rules prevent restore }
  /retail/orders/repeat-last:
    post:
      operationId: repeatLastRetailOrder
      tags: [shop]
      summary: Add eligible lines from the authenticated CUSTOMER or JOBSEEKER account's latest retail order
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }]
      responses:
        "200": { description: Reorder result, content: { application/json: { schema: { $ref: "#/components/schemas/ReorderResult" } } } }
        "401": { description: CUSTOMER or JOBSEEKER authentication required }
  /retail/checkout-preview:
    get:
      operationId: previewRetailCheckout
      tags: [shop]
      summary: Calculate delivery and final total for the selected retail destination
      parameters:
        - { name: deliveryMethod, in: query, schema: { type: string, enum: [courier, personal_belgrade] } }
        - { name: city, in: query, schema: { type: string } }
        - { name: desiredReferralCreditRsd, in: query, schema: { type: integer, minimum: 0 } }
        - { name: couponCode, in: query, schema: { type: string, maxLength: 40 } }
        - { name: aftercareRecommendationId, in: query, description: "Authenticated customer's opaque aftercare recommendation id.", schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' } }
      responses:
        "200":
          description: Checkout pricing preview
          content: { application/json: { schema: { $ref: "#/components/schemas/RetailCheckoutPreview" } } }
        "400": { description: Delivery method is not available for the destination }
        "409":
          description: "A cart item price or availability changed"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /retail/checkout:
    post:
      operationId: checkoutRetailCart
      tags: [shop]
      summary: Create an idempotent retail order from the current guest or authenticated CUSTOMER/JOBSEEKER cart
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RetailCheckoutInput" } } } }
      responses:
        "201": { description: Retail order, content: { application/json: { schema: { $ref: "#/components/schemas/RetailOrder" } } } }
        "409":
          description: "The cart, stock, or displayed checkout quote changed"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /retail/orders/track:
    get:
      operationId: trackRetailOrder
      tags: [shop]
      summary: Track a retail order using its opaque guest access token
      parameters: [{ name: token, in: query, required: true, schema: { type: string, minLength: 32 } }]
      responses:
        "200": { description: Minimized public tracking state, content: { application/json: { schema: { $ref: "#/components/schemas/PublicRetailOrderTracking" } } } }
        "404": { description: "Generic not-found response for invalid, expired, or revoked tokens" }
  /retail/orders/track/lookup:
    post:
      operationId: lookupRetailOrderTracking
      tags: [shop]
      summary: Look up retail tracking by exact order number and normalized email
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RetailTrackingLookupInput" } } } }
      responses:
        "200": { description: Minimized public tracking state; a fresh opaque link is emailed, content: { application/json: { schema: { $ref: "#/components/schemas/PublicRetailOrderTracking" } } } }
        "404": { description: Generic failure for every credential mismatch }
        "429": { description: Generic rate-limit response }
  /customer/retail-orders:
    get:
      operationId: listCustomerRetailOrders
      tags: [customer]
      summary: List only the authenticated CUSTOMER or JOBSEEKER account's retail orders
      responses:
        "200": { description: Retail orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RetailOrder" } } } } }
  /customer/retail-orders/{orderId}:
    get:
      operationId: getCustomerRetailOrder
      tags: [customer]
      summary: Get one retail order owned by the authenticated CUSTOMER or JOBSEEKER account
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Customer-owned retail order, content: { application/json: { schema: { $ref: "#/components/schemas/RetailOrder" } } } }
        "404": { description: Order not found or not owned by the authenticated retail account }
  /admin/retail-orders:
    get:
      operationId: adminListRetailOrders
      tags: [admin]
      summary: List retail orders for administration
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, paid, processing, shipped, delivered, cancelled]
        - name: search
          in: query
          required: false
          description: Search order details or the immutable catalog reference saved on an order item.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200": { description: Retail orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RetailOrder" } } } } }
  /admin/retail-orders/{orderId}:
    get:
      operationId: adminGetRetailOrder
      tags: [admin]
      summary: Get the retail order snapshot and customer delivery details
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Retail order and fulfillment audit, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRetailOrder" } } } }
  /admin/retail-orders/{orderId}/status:
    patch:
      operationId: adminUpdateRetailOrderStatus
      tags: [admin]
      summary: Update retail fulfillment status
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFulfillmentUpdate" } } } }
      responses:
        "200": { description: Updated retail order, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRetailOrder" } } } }
  /admin/commerce/profitability:
    get:
      operationId: adminGetCommerceProfitability
      tags: [admin]
      summary: Aggregate immutable B2C/B2B order-line profitability snapshots
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: market, in: query, schema: { type: string, enum: [B2C, B2B, BOTH], default: BOTH } }
        - { name: supplierId, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: productId, in: query, schema: { type: string } }
        - { name: granularity, in: query, schema: { type: string, enum: [DAY, WEEK, MONTH], default: DAY } }
      responses:
        "200": { description: "Profitability KPIs, time series, and bounded product groups", content: { application/json: { schema: { $ref: "#/components/schemas/AdminProfitabilityReport" } } } }
        "400": { description: Invalid or unbounded date/filter range }
        "403": { description: Administrator access required }
  /admin/retail-orders/{orderId}/payment-status:
    patch:
      operationId: adminUpdateRetailPaymentStatus
      tags: [admin]
      summary: Update retail payment state separately from fulfillment status
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated retail order, content: { application/json: { schema: { $ref: "#/components/schemas/RetailOrder" } } } }
  /retail/products/{productId}/reviews:
    get:
      operationId: listRetailProductReviews
      tags: [shop]
