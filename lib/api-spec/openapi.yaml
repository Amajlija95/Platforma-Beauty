          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: subcategoryId
          in: query
          schema: { type: string }
        - name: courseTypeId
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: accredited
          in: query
          schema: { type: boolean }
        - name: center
          in: query
          schema: { type: string }
        - name: certification
          in: query
          schema: { type: boolean }
