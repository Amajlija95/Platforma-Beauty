            schema: { $ref: "#/components/schemas/RetentionThresholds" }
      responses:
        "200":
          description: Platform-wide per-status counts under current vs. candidate thresholds; above the exact-preview cap the counts are extrapolated from a uniform random sample and flagged with isEstimate/sampleSize
