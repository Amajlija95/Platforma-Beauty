openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LUMERA beauty, wellness, booking, B2B, loyalty, and education marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: salons
  - name: appointments
  - name: customer
  - name: salon-management
  - name: shop
  - name: loyalty
  - name: education
  - name: admin
  - name: growth
  - name: beauty-jobs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/business-register:
    post:
      operationId: registerBusiness
      tags: [auth]
      summary: Register a salon or education-center owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRegistrationInput"
      responses:
        "201":
          description: Registered business owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/jobseeker-register:
    post:
      operationId: registerJobseeker
      tags: [auth]
      summary: Register a JOBSEEKER account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobseekerRegistrationInput" }
      responses:
        "201":
          description: Registered jobseeker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/customer-password-setup/validate:
    post:
      operationId: validateCustomerPasswordSetup
      tags: [auth]
      summary: Validate a short-lived customer password setup token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPasswordSetupTokenInput" }
      responses:
        "200":
          description: Token is currently valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPasswordSetupValidation" }
        "400": { description: Setup link is invalid or no longer usable }
        "429": { description: Too many setup attempts }
  /auth/customer-password-setup/complete:
    post:
      operationId: completeCustomerPasswordSetup
      tags: [auth]
      summary: Consume a one-time setup token and set the customer password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPasswordSetupCompletionInput" }
      responses:
        "200":
          description: Password was set and the one-time token consumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPasswordSetupCompletion" }
        "400": { description: Setup link is invalid or no longer usable }
        "429": { description: Too many setup attempts }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /auth/email-preferences:
    patch:
      operationId: updateEmailPreferences
      tags: [auth]
      summary: Update marketing email preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPreferencesInput"
      responses:
        "200":
          description: Updated email preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreferences"
        "400": { description: Invalid preference }
        "401": { description: Authentication required }
  /auth/sign-in-methods:
    get:
      operationId: getAuthSignInMethods
      tags: [auth]
      summary: List connected sign-in methods for the current user
      responses:
        "200":
          description: Connected sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        "401": { description: Authentication required }
  /auth/sign-in-methods/{provider}:
    delete:
      operationId: disconnectAuthSignInMethod
      tags: [auth]
      summary: Disconnect a social sign-in method from the current user
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
      responses:
        "200":
          description: Updated connected sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        "400": { description: Disconnecting would leave the account without a sign-in method }
        "401": { description: Authentication required }
        "404": { description: Provider is not connected }
  /admin/email-marketing/campaigns:
    get:
      operationId: adminListEmailCampaigns
      tags: [admin]
      summary: List LUMERA email marketing campaigns
      responses:
        "200":
          description: Campaign history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListEmailCampaignsResponse"
    post:
      operationId: adminCreateEmailCampaign
      tags: [admin]
      summary: Create and send or schedule an email campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateEmailCampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMarketingCampaign"
  /admin/sms-deliveries:
    get:
      operationId: adminListSmsDeliveries
      tags: [admin]
      summary: List transactional SMS delivery records
      responses:
        "200":
          description: SMS delivery log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SmsDelivery" }
  /admin/integrations:
    get:
      operationId: adminGetIntegrations
      tags: [admin]
      summary: Get administrator integration settings and delivery health
      responses:
        "200":
          description: Integration settings, OAuth redirect URIs, and reminder status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGetIntegrationsResponse"
  /admin/integrations/webhook-freshness:
    get:
      operationId: adminGetWebhookFreshness
      tags: [admin]
      summary: Get the latest webhook confirmation metadata and delivery health
      responses:
        "200":
          description: Time-derived webhook confirmation metadata and delivery health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGetWebhookFreshnessResponse"
  /admin/integrations/web-push-delivery-metrics:
    get:
      operationId: adminGetWebPushDeliveryMetrics
      tags: [admin]
      summary: Get privacy-safe aggregate Web Push delivery metrics
      parameters:
        - name: periodDays
          in: query
          required: true
          schema:
            type: integer
            enum: [1, 7, 30, 90]
      responses:
        "200":
          description: Aggregate delivery and subscription health for the selected period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWebPushDeliveryMetrics"
  /admin/integrations/brevo/stale-webhooks:
    get:
      operationId: adminListBrevoStaleWebhooks
      tags: [admin]
      summary: List provider-side Brevo webhooks that are eligible for administrator cleanup
      responses:
        "200":
          description: Stale Brevo webhook registrations
          content:
            application/json:
              schema:
                type: object
                required: [staleWebhooks]
                properties:
                  staleWebhooks:
                    type: array
                    items:
                      type: object
                      required: [id, maskedUrl]
                      properties:
                        id: { type: integer }
                        maskedUrl: { type: string }
  /admin/integrations/{integration}:
    put:
      operationId: adminSaveIntegration
      tags: [admin]
      summary: Save administrator integration settings
      parameters:
        - name: integration
          in: path
          required: true
          schema:
            type: string
            enum: [sms, brevo, google_oauth, facebook_oauth, cloudflare, web_push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSaveIntegrationInput"
      responses:
        "200":
          description: Saved integration card with its next concurrency version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIntegrationCard"
        "400": { description: Invalid integration fields or missing loaded version }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Unknown integration }
        "409":
          description: The integration was changed after the settings page loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationSettingsVersionConflict"
  /salons:
    get:
      operationId: listSalons
      tags: [salons]
      summary: Search salons
      parameters:
        - $ref: "#/components/parameters/CityQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/TreatmentQuery"
        - $ref: "#/components/parameters/SortQuery"
        - name: priceMax
          in: query
          schema: { type: number }
        - name: municipality
          in: query
          schema: { type: string }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: minReviewCount
          in: query
          schema: { type: number, minimum: 0 }
        - name: availability
          in: query
          schema: { type: string, enum: [today, tomorrow, this-week] }
        - name: homeService
          in: query
          schema: { type: boolean }
        - name: gender
          in: query
          schema: { type: string, enum: [all, women, men, everyone] }
        - name: discountsOnly
          in: query
          schema: { type: boolean }
        - name: acceptsCards
          in: query
          schema: { type: boolean }
        - name: openSunday
          in: query
          schema: { type: boolean }
        - name: instantBooking
          in: query
          schema: { type: boolean }
        - name: topSalon
          in: query
          schema: { type: boolean }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: brand
          in: query
          schema: { type: string }
        - name: latitude
          in: query
          schema: { type: number }
        - name: longitude
          in: query
          schema: { type: number }
        - name: page
          in: query
          description: 1-based page number. All filters and the chosen sort are applied in SQL BEFORE this page is selected.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of salons per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: One page of salon results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCard" }
  /discovery/home:
    get:
      operationId: getMarketplaceHomeDiscovery
      tags: [salons]
      summary: Get curated public discovery content for the marketplace homepage
      parameters:
        - $ref: "#/components/parameters/CityQuery"
      responses:
        "200":
          description: City-aware discovery shelves and popular services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceHomeDiscovery" }
  /cities:
    get:
      operationId: listCities
      tags: [salons]
      summary: List cities that have active salons with salon counts
      responses:
        "200":
          description: Cities derived from active salons, ordered deterministically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CitySummary" }
  /platform/trust-stats:
    get:
      operationId: getPlatformTrustStats
      tags: [salons]
      summary: Get public marketplace trust statistics
      responses:
        "200":
          description: Aggregated marketplace trust statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTrustStats" }
  /salons/{slug}:
    get:
      operationId: getSalon
      tags: [salons]
      summary: Get salon profile
      parameters:
        - $ref: "#/components/parameters/SalonSlug"
      responses:
        "200":
          description: Active salon profile, or an inactive profile containing exactly name, active=false and public city. Inactive profiles never expose street, entrance, contact, coordinate or booking details.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SalonProfile"
                  - type: object
                    additionalProperties: false
                    required: [name, active, city]
                    properties:
                      name:
                        type: string
                      active:
                        type: boolean
                        enum: [false]
                      city:
                        type: string
  /salons/{salonId}/availability:
    get:
      operationId: getSalonAvailability
      tags: [salons]
      summary: Get available booking slots
      parameters:
        - $ref: "#/components/parameters/SalonId"
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: employeeIds
          in: query
          style: form
          explode: true
          description: Ordered employee positions; an empty value means that position may use any qualified available employee.
          schema:
            type: array
            maxItems: 20
            items: { type: string }
        - name: date
          in: query
          required: true
          schema: { type: string }
        - name: granularityMinutes
          in: query
          description: Optional requested cadence. The salon booking policy remains authoritative.
          schema: { type: integer, minimum: 5, maximum: 180 }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeSlot" }
  /salons/{salonId}/first-available:
    get:
      operationId: getSalonFirstAvailable
      tags: [salons]
      summary: Get the first available slot for every active salon service
      parameters:
        - $ref: "#/components/parameters/SalonId"
      responses:
        "200":
          description: First available booking slots for active services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonFirstAvailable" }
        "404": { description: Salon not found }
  /salons/{salonId}/grouped-availability:
    post:
      operationId: getGroupedBookingAvailability
      tags: [appointments]
      summary: Find contiguous or bounded-gap availability for an ordered treatment group
      parameters:
        - $ref: "#/components/parameters/SalonId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupedAvailabilityInput" }
      responses:
        "200":
          description: Grouped booking candidates with an ordered slot for every treatment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupedAvailabilityResponse" }
        "400": { description: Invalid date range or treatment selection }
        "404": { description: "Salon, service, or employee not found" }
  /booking-groups:
    post:
      operationId: createBookingGroup
      tags: [appointments]
      summary: Atomically book an ordered group of treatments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingGroupInput" }
      responses:
        "201":
          description: Created booking group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroup" }
        "409":
          description: A selected slot is unavailable, or the canonical active-group layout would be invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupConflict" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /salon/booking-groups:
    post:
      operationId: createSalonBookingGroup
      tags: [salon-management]
      summary: Atomically create a manual grouped booking for a CRM customer or guest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualBookingGroupInput" }
      responses:
        "201":
          description: Created real booking group and its linked appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroup" }
        "403": { description: Salon owner access required }
        "409":
          description: A slot, resource, or canonical group layout conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupConflict" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /employee/booking-groups:
    post:
      operationId: createEmployeeBookingGroup
      tags: [employee-portal]
      summary: Atomically create a manual grouped booking assigned to the signed-in employee
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualBookingGroupInput" }
      responses:
        "201":
          description: Created real booking group and its linked appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroup" }
        "403": { description: Active employee access or customer relationship required }
        "409":
          description: A slot, resource, or canonical group layout conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupConflict" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /booking-commands/{idempotencyKey}:
    get:
      operationId: getBookingCommandReceipt
      tags: [appointments]
      summary: Recover the durable outcome of an authenticated booking command
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: salonId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Original successful booking response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingCommandReceipt" }
        "401": { description: Authentication required }
        "404": { description: No receipt exists in this actor and salon scope }
  /booking-groups/{bookingGroupId}/reschedule:
    patch:
      operationId: rescheduleBookingGroup
      tags: [appointments]
      summary: Atomically reschedule selected active members, or the complete active booking group
      parameters:
        - name: bookingGroupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingGroupRescheduleInput" }
      responses:
        "200":
          description: Updated group; gapWarning is retained for compatibility and is null for invariant-preserving mutations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupOperationResult" }
        "403": { description: The actor may not manage this group }
        "404": { description: Booking group not found }
        "409":
          description: A selected slot is unavailable, or the canonical active remainder would be invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupConflict" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /booking-groups/{bookingGroupId}/cancel:
    post:
      operationId: cancelBookingGroup
      tags: [appointments]
      summary: Atomically cancel selected active members, or all active members of a booking group
      parameters:
        - name: bookingGroupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingGroupCancelInput" }
      responses:
        "200":
          description: Updated booking group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupOperationResult" }
        "403": { description: The actor may not manage this group }
        "404": { description: Booking group not found }
        "409":
          description: Cancelling the selected members would leave an invalid active remainder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingGroupConflict" }
  /appointments:
    get:
      operationId: listMyAppointments
      tags: [appointments]
      summary: List appointments for the signed-in user
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, completed, cancelled, no-show] }
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past, all], default: all }
        - name: page
          in: query
          description: 1-based page number for stable pagination (date asc, startTime asc, id asc).
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of appointments per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a booking
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: >-
            Booking conflict. Package redemption failures carry a stable
            discriminator `code: PACKAGE_ERROR` plus the specific `reason`;
            plain availability conflicts omit `code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflictError"
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /employee/locations:
    get:
      operationId: listEmployeeAssignedLocations
      tags: [salon-management]
      summary: List the signed-in employee's active location assignments
      responses:
        "200":
          description: Active assignments and selected location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeAssignedLocations" }
        "403": { description: Active employee access required }
  /employee/active-location:
    patch:
      operationId: selectEmployeeActiveLocation
      tags: [salon-management]
      summary: Select an actively assigned employee location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeActiveLocationInput" }
      responses:
        "200":
          description: Selected active location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeActiveLocation" }
        "403": { description: Employee is not actively assigned to location }
  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Reschedule or update appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /appointments/{appointmentId}/salon-contact:
    get:
      operationId: getAppointmentSalonContact
      tags: [appointments]
      summary: Get salon contact details for the signed-in customer's qualifying booking
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Private salon contact and exact location for this booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSalonContact"
        "403": { description: The appointment is cancelled or does not belong to the signed-in customer }
        "404": { description: Appointment not found }
  /appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAppointmentInput"
      responses:
        "200":
          description: Cancelled appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{appointmentId}/lifecycle:
    post:
      operationId: transitionAppointmentLifecycle
      tags: [appointments]
      summary: Record an audited appointment lifecycle transition
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentLifecycleInput" }
      responses:
        "200":
          description: Appointment with actual timing and lifecycle audit state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "409":
          description: Transition is invalid for the current lifecycle state, or the useful late-treatment window has elapsed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentLifecycleConflict" }
  /customer/notifications:
    get:
      operationId: listCustomerNotifications
      tags: [customer]
      summary: List the signed-in customer's durable notification inbox
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Stable reverse-chronological notification page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerNotificationPage" }
  /customer/notifications/{notificationId}/read:
    post:
      operationId: markCustomerNotificationRead
      tags: [customer]
      summary: Idempotently mark a customer notification read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerNotification" }
        "404": { description: Notification not found }
  /customer/notifications/read-all:
    post:
      operationId: markAllCustomerNotificationsRead
      tags: [customer]
      summary: Mark every current customer notification read
      responses:
        "204": { description: All notifications marked read }
  /push/config:
    get:
      operationId: getWebPushConfig
      tags: [customer]
      summary: Get the public Web Push configuration
      responses:
        "200":
          description: Public VAPID key availability; the private key is never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushConfig" }
  /push/deliveries/acknowledge:
    post:
      operationId: acknowledgeSystemPushDelivery
      tags: [customer]
      summary: Confirm that a service worker displayed a Web Push notification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemPushDeliveryAcknowledgement" }
      responses:
        "204": { description: Delivery acknowledgement accepted }
        "400": { description: Invalid acknowledgement }
  /customer/push-subscriptions:
    get:
      operationId: listPushSubscriptions
      tags: [customer]
      summary: List Web Push devices owned by the current user
      responses:
        "200":
          description: Current user's device subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushSubscription" }
        "401": { description: Authentication required }
    post:
      operationId: upsertPushSubscription
      tags: [customer]
      summary: Register or refresh the current browser's Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "200":
          description: Registered device subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400": { description: Invalid subscription }
        "401": { description: Authentication required }
        "503": { description: Web Push is not configured }
  /customer/push-subscriptions/{subscriptionId}:
    delete:
      operationId: deletePushSubscription
      tags: [customer]
      summary: Disable and remove a Web Push device owned by the current user
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Device subscription removed }
        "401": { description: Authentication required }
        "404": { description: Subscription not found or not owned by the current user }
  /customer/dashboard:
    get:
      operationId: getCustomerDashboard
      tags: [customer]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Customer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"
  /jobseeker/profile:
    get:
      operationId: getJobseekerProfile
      tags: [beauty-jobs]
      summary: Get the signed-in jobseeker profile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/JobseekerProfile" } } } }
        "403": { description: JOBSEEKER access required }
    put:
      operationId: updateJobseekerProfile
      tags: [beauty-jobs]
      summary: Replace the signed-in jobseeker professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobseekerProfileInput" }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/JobseekerProfile" } } } }
        "400": { description: Invalid profile or media references }
        "403": { description: JOBSEEKER access required }
  /jobseeker/dashboard:
    get:
      operationId: getJobseekerDashboard
      tags: [beauty-jobs]
      summary: Get private JOBSEEKER dashboard counts
      responses:
        "200": { description: Dashboard counts, content: { application/json: { schema: { $ref: "#/components/schemas/JobseekerDashboard" } } } }
        "403": { description: JOBSEEKER access required }
  /jobseeker/salon-interests:
    get:
      operationId: listJobseekerSalonInterests
      tags: [beauty-jobs]
      summary: List the signed-in jobseeker's salon interests
      responses:
        "200": { description: Salon ids, content: { application/json: { schema: { type: array, items: { type: string } } } } }
    put:
      operationId: replaceJobseekerSalonInterests
      tags: [beauty-jobs]
      summary: Replace the signed-in jobseeker's salon interests
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobseekerSalonInterestsInput" }
      responses:
        "200": { description: Salon ids, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /customer/favorites:
    get:
      operationId: listFavorites
      tags: [customer]
      summary: List favorite salons
      responses:
        "200":
          description: Favorite salons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCard" }
    post:
      operationId: toggleFavorite
      tags: [customer]
      summary: Add or remove a favorite salon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResult"
  /customer/reviews/{salonId}:
    get:
      operationId: getCustomerSalonReview
      tags: [customer]
      summary: Get the current customer's review and completed services for a salon
      parameters:
        - $ref: "#/components/parameters/SalonId"
      responses:
        "200":
          description: Customer review context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSalonReviewContext" }
        "403": { description: Customer access required }
        "404": { description: Salon not found }
    put:
      operationId: upsertCustomerSalonReview
      tags: [customer]
      summary: Create or update the current customer's review for a completed salon visit
      parameters:
        - $ref: "#/components/parameters/SalonId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerReviewInput" }
      responses:
        "200":
          description: Saved customer review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerReview" }
        "400": { description: Invalid review }
        "403": { description: Customer access required }
        "404": { description: Salon not found }
    delete:
      operationId: deleteCustomerSalonReview
      tags: [customer]
      summary: Permanently delete the current customer's review for a salon
      parameters:
        - $ref: "#/components/parameters/SalonId"
      responses:
        "204": { description: Review deleted }
        "403": { description: Customer access required }
        "404": { description: Salon or customer review not found }
  /salon/dashboard:
    get:
      operationId: getSalonDashboard
      tags: [salon-management]
      summary: Active salon or owner-wide dashboard summary
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [location, all]
            default: location
      responses:
        "200":
          description: Salon dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonDashboard"
  /salon/profile:
    get:
      operationId: getManagedSalonProfile
      tags: [salon-management]
      summary: Get editable public profile settings for the active owned salon
      responses:
        "200":
          description: Editable salon profile settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonProfileMedia" }
        "403": { description: Salon-owner access required }
    patch:
      operationId: updateManagedSalonProfile
      tags: [salon-management]
      summary: Update public profile settings for the active owned salon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonProfileMediaUpdate" }
      responses:
        "200":
          description: Updated salon profile settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonProfileMedia" }
        "400": { description: Invalid profile media }
        "403": { description: Salon-owner access required }
  /salon/booking-settings:
    get:
      operationId: getSalonBookingSettings
      tags: [salon-management]
      summary: Get active location booking policy, date overrides, and resource downtime
      responses:
        "200":
          description: Dynamic calendar settings for the active location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonBookingSettings" }
        "403": { description: Salon management access required }
    put:
      operationId: replaceSalonBookingSettings
      tags: [salon-management]
      summary: Replace active location booking policy and calendar exceptions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonBookingSettingsInput" }
      responses:
        "200":
          description: Replaced dynamic calendar settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonBookingSettings" }
        "400": { description: "Invalid granularity, reminder, hours, or downtime values" }
        "403": { description: Salon management access required }
  /media/uploads:
    post:
      operationId: requestMediaUpload
      tags: [media]
      summary: Create an owner-scoped App Storage image upload ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadInput" }
      responses:
        "200":
          description: Short-lived direct upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadTicket" }
        "400": { description: Invalid or unsupported image metadata }
        "403": { description: The current user cannot upload for this scope }
        "413": { description: Image exceeds the upload limit }
  /media/uploads/{uploadId}/finalize:
    post:
      operationId: finalizeMediaUpload
      tags: [media]
      summary: Validate, transform and promote a staged image
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      responses:
        "200":
          description: Existing finalized asset (idempotent retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "201":
          description: Validated and finalized asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { description: The staged object is not a valid supported image }
        "403": { description: Upload ticket does not belong to the current user }
        "404": { description: Upload ticket not found }
        "410": { description: Upload ticket expired }
  /media/{assetId}:
    get:
      operationId: getMediaAsset
      tags: [media]
      summary: Serve an optimized image variant using Accept negotiation
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
        - name: size
          in: query
          schema: { type: string, enum: [thumbnail, medium, large, original], default: large }
        - name: format
          in: query
          schema: { type: string, enum: [avif, webp, fallback, original] }
        - name: v
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Optimized image bytes
          content:
            image/avif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "304": { description: Not modified }
        "403": { description: Private media access denied }
        "404": { description: Image or requested variant not found }
  /media/descriptions:
    post:
      operationId: getMediaDescriptions
      tags: [media]
      summary: Return descriptions for readable managed images
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaDescriptionsRequest" }
      responses:
        "200":
          description: Readable image descriptions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDescriptionsResponse" }
  /salon/appointments:
    get:
      operationId: listSalonAppointments
      tags: [salon-management]
      summary: List salon appointments
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: page
          in: query
          description: 1-based page number for stable pagination (date asc, startTime asc, id asc).
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of appointments per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Salon appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createSalonAppointment
      tags: [salon-management]
      summary: Create a salon appointment for a CRM customer or walk-in guest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonAppointmentCreate" }
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /salon/appointment-series/preview:
    post:
      operationId: previewSalonAppointmentSeries
      tags: [salon-management]
      summary: Check availability for a salon appointment series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesPreviewInput" }
      responses:
        "200":
          description: Availability preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesPreview" }
  /salon/package-appointments/preview:
    post:
      operationId: previewSalonPackageAppointments
      tags: [salon-management]
      summary: Preview booking every remaining session in a purchased package
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonPackageAppointmentsInput" }
      responses:
        "200":
          description: Package booking availability and entitlement preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonPackageAppointmentsPreview" }
  /salon/package-appointments:
    post:
      operationId: createSalonPackageAppointments
      tags: [salon-management]
      summary: Atomically book every remaining session in a purchased package
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonPackageAppointmentsInput" }
      responses:
        "201":
          description: Created per-service series and package appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonPackageAppointmentsResult" }
        "429": { $ref: "#/components/responses/BookingCapacityReached" }
  /salon/time-blocks:
    get:
      operationId: listSalonTimeBlocks
      tags: [salon-management]
      summary: List owner-created employee time blocks for a date
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: employeeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Time blocks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EmployeeTimeBlock" } }
    post:
      operationId: createSalonTimeBlock
      tags: [salon-management]
      summary: Create a same-day intraday employee block
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeTimeBlockInput" }
      responses:
        "201":
          description: Created time block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeTimeBlock" }
        "409": { description: The block overlaps an active appointment }
  /salon/time-blocks/{timeBlockId}:
    delete:
      operationId: deleteSalonTimeBlock
      tags: [salon-management]
      summary: Delete an owner-created intraday employee block
      parameters:
        - name: timeBlockId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "404": { description: Time block not found }
  /salon/availability/search:
    get:
      operationId: searchSalonAvailability
      tags: [salon-management]
      summary: Search server-confirmed owner booking availability over seven calendar days
      parameters:
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
        - name: startDate
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: employeeIds
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: granularityMinutes
          in: query
          description: Optional requested cadence. The salon booking policy remains authoritative.
          schema: { type: integer, minimum: 5, maximum: 180 }
      responses:
        "200":
          description: Chronological server-confirmed slots in the bounded seven-day window; calendar clients treat dates without slots as unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilitySearchResponse" }
        "404": { description: Service or employee not found in the active salon }
  /salon/calendar-day:
    get:
      operationId: getSalonCalendarDay
      tags: [salon-management]
      summary: Get active employee schedules and all-day leave for an owner calendar day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Active employees with their explicit schedule windows and approved all-day leave
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SalonCalendarDayEmployee" } }
