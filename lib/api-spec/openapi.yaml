      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Subscription status, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWaitlistStatus" } } } } }
    post:
      operationId: subscribeB2cProductWaitlist
      tags: [shop]
      summary: Subscribe the signed-in customer to an out-of-stock B2C product
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Subscription created, content: { application/json: { schema: { $ref: "#/components/schemas/ProductWaitlistSubscription" } } } }, "409": { description: Product is in stock } }
    delete:
      operationId: unsubscribeB2cProductWaitlist
      tags: [shop]
      summary: Unsubscribe the signed-in customer (idempotent)
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Unsubscribed } }
