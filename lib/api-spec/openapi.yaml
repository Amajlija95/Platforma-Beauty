        - name: seriesId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesMoveInput" }
      responses:
        "200":
          description: Series move availability preview
