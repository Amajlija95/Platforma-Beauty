        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: ["string", "null"], maxLength: 1000 }
              required: [decision]
      responses:
        "200":
          description: Reviewed proposal
