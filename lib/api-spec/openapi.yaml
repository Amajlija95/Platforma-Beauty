        fromStatus: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        toStatus: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        count: { type: number, description: "Customers that would move fromStatus → toStatus" }
      required: [fromStatus, toStatus, count]

    RetentionPreviewAffectedSalon:
      type: object
      properties:
        salonId: { type: string }
        salonName: { type: string }
        reclassifiedCount: { type: number, description: "Customers of this salon whose status would change under the candidate thresholds" }
        totalCustomers: { type: number, description: "Total customers this salon has — puts the reclassified count in proportion" }
        reclassifiedCountMarginOfError:
          type: ["number", "null"]
          description: "Approximate 95% Wilson margin of error for reclassifiedCount in a stratified estimate; null for exact counts and full-salon censuses"
        sampleSize:
          type: ["number", "null"]
          description: "Customers classified for this salon in a stratified estimate; null for exact counts"
      required: [salonId, salonName, reclassifiedCount, totalCustomers, reclassifiedCountMarginOfError, sampleSize]

    RetentionSettingsPreview:
      type: object
      properties:
        currentVersion: { type: number, description: "Settings version the current counts were computed against (0 = platform defaults)" }
        totalCustomers: { type: number, description: "Salon customers evaluated platform-wide" }
        reclassifiedCount: { type: number, description: "Customers whose status would change under the candidate thresholds" }
        reclassifiedCountMarginOfError:
          type: ["number", "null"]
          description: "Approximate 95% margin of error for reclassifiedCount when isEstimate is true; null in exact mode"
        currentCounts: { $ref: "#/components/schemas/RetentionStatusCounts" }
        currentCountMarginsOfError:
          oneOf:
            - $ref: "#/components/schemas/RetentionStatusCounts"
            - type: "null"
          description: "Approximate 95% Wilson margin of error for each current status count when isEstimate is true; null in exact mode"
        candidateCounts: { $ref: "#/components/schemas/RetentionStatusCounts" }
        candidateCountMarginsOfError:
          oneOf:
            - $ref: "#/components/schemas/RetentionStatusCounts"
            - type: "null"
          description: "Approximate 95% Wilson margin of error for each candidate status count when isEstimate is true; null in exact mode"
        shifts:
          type: array
          description: "Status moves under the candidate thresholds, largest first"
          items: { $ref: "#/components/schemas/RetentionReclassificationShift" }
        topAffectedSalons:
          type: array
          description: "Salons with the most reclassified customers, largest first (top 10); estimate mode returns rows only when salonRankingAvailable is true"
          items: { $ref: "#/components/schemas/RetentionPreviewAffectedSalon" }
        topShareAffectedSalons:
          type: array
          description: "Salons with the highest SHARE of reclassified customers, largest first (top 10); only salons with at least shareRankingMinCustomers customers qualify; estimate mode returns rows only when salonRankingAvailable is true"
          items: { $ref: "#/components/schemas/RetentionPreviewAffectedSalon" }
        shareRankingMinCustomers: { type: number, description: "Minimum customers a salon needs to qualify for the share-based ranking" }
        isEstimate:
          type: boolean
          description: "True when the platform exceeded the exact-preview cap and counts are approximate; render such values as approximate (~), never as exact. Salon rankings are returned only when salonRankingAvailable is true for the opt-in stratified design."
        sampleSize:
          type: ["number", "null"]
          description: "Customers actually classified when isEstimate is true; null in exact mode"
        salonRankingAvailable:
          type: boolean
          description: "True for exact previews and for estimate previews backed by the opt-in stratified per-salon sample; false means per-salon rankings are intentionally unavailable"
      required: [currentVersion, totalCustomers, reclassifiedCount, reclassifiedCountMarginOfError, currentCounts, currentCountMarginsOfError, candidateCounts, candidateCountMarginsOfError, shifts, topAffectedSalons, topShareAffectedSalons, shareRankingMinCustomers, isEstimate, sampleSize, salonRankingAvailable]

    RetentionSettingsUpdate:
      allOf:
        - $ref: "#/components/schemas/RetentionThresholds"
        - type: object
          properties:
            changeSource:
              type: string
              enum: [manual, restore_version, restore_defaults]
              description: "How this version came to be; defaults to manual. restore_version requires restoredFromVersion and thresholds identical to that version; restore_defaults requires thresholds identical to the platform defaults"
            restoredFromVersion:
              type: number
              minimum: 1
              multipleOf: 1
              description: "Version whose values are being restored; only allowed (and required) when changeSource is restore_version"
            expectedVersion:
              type: number
              minimum: 0
              multipleOf: 1
              description: "Active settings version this edit was based on (0 = platform defaults); the server rejects with 409 when a newer version exists"
          required: [expectedVersion]

    RetentionSettingsVersionConflict:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [VERSION_CONFLICT] }
        expectedVersion: { type: number, description: "Version the client based its edit on" }
        activeVersion: { type: number, description: "Version currently active on the server" }
        changedByName: { type: ["string", "null"], description: "Display name of the administrator who saved the winning version; null when platform defaults are active or the user is unknown" }
        changedAt: { type: ["string", "null"], description: "ISO timestamp of the winning version; null when platform defaults are active" }
      required: [error, code, expectedVersion, activeVersion, changedByName, changedAt]

    RetentionSettingsHistoryEntry:
      type: object
      properties:
        version: { type: number }
        thresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        previousThresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        changedByUserId: { type: ["string", "null"] }
        changedByName: { type: ["string", "null"] }
        changedAt: { type: ["string", "null"], description: "ISO timestamp of the change" }
        changeSource: { type: string, enum: [manual, restore_version, restore_defaults], description: "How the version came to be: hand-edited, restored from an earlier version, or restored platform defaults" }
        restoredFromVersion: { type: ["number", "null"], description: "Source version when changeSource is restore_version; null otherwise" }
      required: [version, thresholds, previousThresholds, changedByUserId, changedByName, changedAt, changeSource, restoredFromVersion]

    GrowthAdminSummary:
      type: object
      properties:
        automation:
          type: object
          properties:
