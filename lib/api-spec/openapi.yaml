      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonCustomerUpdate" }
      responses:
        "200":
          description: Updated CRM customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonCustomer" }
  /salon/appointments/{appointmentId}:
