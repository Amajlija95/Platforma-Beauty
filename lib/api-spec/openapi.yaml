  /education/courses/{courseId}/enrollments:
    post:
      operationId: enrollInEducationCourse
      tags: [education]
      summary: Request a course purchase for the purchaser or one salon employee; access and escrow begin only after trusted manual settlement
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationEnrollmentInput" }
      responses:
        "201":
          description: Pending enrollment request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationEnrollment" }
        "403": { description: Business access required }
        "409": { description: Course is full or already enrolled }
  /education/courses/{courseId}/group-enrollments:
    post:
      operationId: createEducationGroupEnrollments
      tags: [education]
      summary: Request one course purchase per selected salon employee in a single transaction
      parameters:
        - $ref: "#/components/parameters/CourseId"
        # Deliberately NOT the shared IdempotencyKey parameter, which is
        # required. This operation's header is optional and callers rely on
        # omitting it; generated-api-header-typing.type-check.ts asserts that.
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional client-generated command identifier recorded on each created enrollment.
          # Optional to send, but validated exactly like the shared required
          # parameter when it is sent: presence and well-formedness are separate
          # questions, and a malformed key is a client bug either way.
          schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationGroupEnrollmentInput" }
      responses:
        "201":
          description: Group enrollment requests created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationGroupEnrollmentResponse" }
        "400": { description: Invalid employee selection or missing online-content consent }
        "403": { description: Salon owner access required }
        "404": { description: Course not available }
        "409": { description: Enrollment conflict or course terms changed }
  /education/enrollments/{enrollmentId}/payment-instructions:
